<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Chess Enthusiasts</title>
<style>
:root{--bg:#eef1f3;--sf:#fff;--tx:#17222b;--mu:#667580;--ac:#1d6b57;--me:#1d6b57;--met:#fff;--bd:#dde3e7;--in:#f1f4f6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1417;--sf:#182026;--tx:#e8eef1;--mu:#8fa0aa;--ac:#4fc4a0;--me:#1f6f5c;--bd:#27323a;--in:#222d35}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
#chat{position:relative;display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
header .lg{width:42px;height:42px;border-radius:50%;flex:none}header div{flex:1;min-width:0}
header h1{font-size:18px;margin:0;line-height:1.2}header small{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:22px;background:var(--ac);color:#fff;padding:11px 18px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#08201a}}
.ib{width:42px;height:42px;border-radius:50%;background:var(--in);color:var(--tx);font-size:22px;padding:0;display:grid;place-items:center;flex:none;line-height:1}
#list{flex:1;min-height:0;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;display:flex;gap:8px;align-items:flex-end}.m.me{align-self:flex-end;flex-direction:row-reverse}.m.cont{margin-top:-8px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;font-size:22px;display:grid;place-items:center;flex:none;overflow:hidden}
.cont .av{visibility:hidden}.cont .n{display:none}
.col{display:flex;flex-direction:column;min-width:0}.m.me .col{align-items:flex-end}
.b{background:var(--sf);border:1px solid var(--bd);border-radius:18px 18px 18px 6px;padding:8px 13px;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.me .b{background:var(--me);color:var(--met);border-color:var(--me);border-radius:18px 18px 6px 18px}.m.cont .b{border-radius:18px}
.n{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:1px}.t{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.sn{font-size:12px;color:var(--mu);margin:3px 6px 0}
.q{font-size:13px;opacity:.85;border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:5px;background:#8882;border-radius:4px}.me .q{border-color:#fff9}
.b img,.b video{max-width:min(280px,100%);max-height:320px;border-radius:12px;display:block;margin:3px 0}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.ch{font-size:14px;padding:2px 8px;border-radius:12px;background:#8832;border:1px solid transparent}.ch.on{border-color:var(--ac)}
.bd{display:grid;grid-template-columns:repeat(8,1fr);width:224px;max-width:100%;margin:4px 0;border-radius:4px;overflow:hidden}
.bd div{aspect-ratio:1;display:grid;place-items:center;font-size:22px;line-height:1;color:#111}
.lt{background:#eeeed2}.dk{background:#769656}.bd .w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
#pn{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;font-size:14px;background:var(--sf);border-bottom:1px solid var(--bd)}
#pt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#pn b{cursor:pointer;padding:4px 8px}
#ty{font-size:13px;color:var(--mu);padding:0 16px 4px;min-height:20px}
#rb{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;font-size:14px;background:var(--sf);border-top:1px solid var(--bd);color:var(--mu)}#rb b{cursor:pointer;padding:0 6px}
form{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));background:var(--sf);border-top:1px solid var(--bd);align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:2px;background:var(--in);border-radius:24px;padding:2px 6px;min-width:0}
.pill input[type=text]{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;padding:11px 6px;outline:0}
.pill .ic{width:40px;height:40px;border-radius:50%;background:transparent;color:var(--mu);font-size:21px;padding:0;display:grid;place-items:center;flex:none}
#gf{font-size:13px;font-weight:800}#snd{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
#dn{position:absolute;right:14px;bottom:80px;width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 8px #0003;z-index:3}
#sh{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sh .box{background:var(--sf);width:min(680px,100%);border-radius:20px 20px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:2px}
.ems{display:flex;justify-content:space-around;padding:6px 0 10px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.em{font-size:28px;background:transparent;padding:6px 10px;border-radius:14px;color:inherit}
.it{background:transparent;color:var(--tx);text-align:left;font-size:17px;padding:14px 12px;border-radius:12px}.it.dg{color:#d64545}.it:active,.em:active{background:var(--in)}
#gp{background:var(--sf);border-top:1px solid var(--bd);padding:10px;max-height:46%;overflow:auto}
#gq{width:100%;padding:10px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
#gg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0;color:var(--mu);font-size:14px}#gg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
#vwb{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:9}#vw{max-width:100%;max-height:100%}
#rp{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:8;padding:14px}
#rp .pn{background:var(--sf);border-radius:18px;padding:18px;width:min(440px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#rp h3{margin:0}#rp input{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
.rr{padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}.rr div{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px}.gh{background:transparent;color:var(--mu);border:1px solid var(--bd)}
#join{margin:auto;width:min(360px,92%);display:flex;flex-direction:column;gap:12px;text-align:center;background:var(--sf);padding:28px 22px;border-radius:22px;box-shadow:0 8px 30px #0001}
#join .k{width:84px;height:84px;border-radius:50%;margin:0 auto}
#join input{padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}#join button{padding:14px;font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}#msg{color:#d64545;min-height:1.2em;font-size:14px}.hide{display:none!important}
</style></head><body><div id="app">
<div id="join" class="hide"><img class="k" src="icon-192.png" alt=""><h2 style="margin:0">Chess Enthusiasts</h2>
<input id="nm" placeholder="Your display name" maxlength="20"><input id="pw" type="password" placeholder="Room passcode">
<button id="go">Join chat</button><div id="msg"></div></div>
<div id="chat" class="hide">
<header><img class="lg" src="icon-192.png" alt=""><div><h1>Chess Enthusiasts</h1><small id="who"></small></div><button class="ib" id="mn" aria-label="Menu">⋯</button><button class="hide" id="rtb"></button><button class="hide" id="bell"></button></header>
<div id="pn" class="hide"><span id="pt"></span><b id="px" title="Unpin">✕</b></div><div id="list"></div><button id="dn" class="hide" aria-label="Jump to latest">↓</button><div id="ty"></div>
<div id="rb" class="hide"><span id="rt"></span><b id="rc">✕</b></div>
<div id="gp" class="hide"><input id="gq" placeholder="Search GIFs"><div id="gg"></div><small style="color:var(--mu)">Powered by GIPHY</small></div>
<form id="f"><div class="pill"><button type="button" class="ic" id="at" title="Photo or video" aria-label="Attach">📎</button><input type="text" id="tx" placeholder="Message" autocomplete="off"><button type="button" class="ic" id="gf" title="GIF">GIF</button></div>
<button id="snd" aria-label="Send"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
<input type="file" id="fi" accept="image/*,video/*" class="hide"><input type="file" id="avf" accept="image/*" class="hide"></form></div>
<div id="sh" class="hide"></div>
<div id="vwb" class="hide"><img id="vw" alt=""></div>
<div id="rp" class="hide"><div class="pn"><h3>🏆 Ratings</h3><div id="rl"></div><small>Your usernames (optional)</small>
<input id="lu" placeholder="Lichess username"><input id="cu" placeholder="Chess.com username"><div class="row"><button id="rs">Save</button><button id="rcl" class="gh">Close</button></div></div></div>
<div id="load" style="margin:auto;color:var(--mu)">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Supabase and GIF settings live in config.js */
const $=id=>document.getElementById(id);
addEventListener('error',e=>{const l=$('load');if(l&&!l.classList.contains('hide'))l.textContent='Error: '+e.message});
let sb;try{sb=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_KEY.trim())}catch(e){$('load').textContent='Setup problem: check the values in config.js ('+e.message+')'}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const BOTS={'00000000-0000-0000-0000-000000000001':'🤖','00000000-0000-0000-0000-000000000002':'🦉'};
let uid,me,members=[],started=false,ready=false,ch,reply=null,editing=null,unread=0,online=0,lt=0,tt;
const msgs=new Map(),nodes=new Map();let reacts=[];
const PC=['♔','♕','♖','♗','♘','♙'],EM=['👍','♟️','😂','❤️','😮','🔥'];
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const col=s=>`hsl(${hs(s)} 40% 38%)`;
const show=v=>{$('load').classList.add('hide');$('join').classList.toggle('hide',v!=='join');$('chat').classList.toggle('hide',v!=='chat')};
const head=()=>{$('who').textContent=members.length+' members, '+online+' online: '+members.map(m=>m.name).join(', ')};
async function refreshMembers(){
  const {data,error}=await sb.from('members').select('*').order('created_at');if(error)throw error;
  const k=x=>x.map(m=>m.id+m.avatar_url).join(),o=k(members);members=data;me=members.find(m=>m.id===uid);head();
  if(started&&o!==k(members))msgs.forEach(draw);
  if(started)updSeen()}
async function boot(){if(!sb)return;
  try{let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    uid=session.user.id;await refreshMembers();me?startChat():show('join')}
  catch(e){$('load').textContent='Error: '+(e.message||e)}}
$('go').onclick=async()=>{
  const name=$('nm').value.trim(),pw=$('pw').value,m=$('msg');m.textContent='';
  if(!name||!pw){m.textContent='Enter a name and the passcode.';return}
  const {data,error}=await sb.rpc('join_chat',{p_pass:pw,p_name:name});
  if(error){m.textContent='Could not join: '+error.message;return}
  if(data==='wrong'){m.textContent='Wrong passcode.';return}
  if(data==='full'){m.textContent='Chat is full.';return}
  if(data!=='ok'){m.textContent='Could not join ('+data+').';return}
  await refreshMembers();startChat()};
/* chess board from FEN */
const PS={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function board(fen){const rows=fen.trim().split(' ')[0].split('/');if(rows.length!==8)return null;
  const g=el('div','bd');let ok=true;
  const sq=(r,c,ch)=>{const d=el('div',(r+c)%2?'dk':'lt',ch?PS[ch]+'\uFE0E':'');if(ch&&ch===ch.toUpperCase())d.classList.add('w');g.append(d)};
  rows.forEach((row,i)=>{let c=0;for(const ch of row){if(/[1-8]/.test(ch)){for(let k=0;k<+ch;k++)sq(i,c++,'')}else if(PS[ch])sq(i,c++,ch);else ok=false}if(c!==8)ok=false});
  return ok?g:null}
function bar(){const on=reply||editing;$('rb').classList.toggle('hide',!on);
  if(on)$('rt').textContent=editing?'Editing message':'Replying to '+reply.name+': '+(reply.body||'media').slice(0,40)}
$('rc').onclick=()=>{reply=null;if(editing)$('tx').value='';editing=null;bar()};
function rm(id){const n=nodes.get(id);if(n)n.remove();nodes.delete(id);msgs.delete(id);reacts=reacts.filter(r=>r.message_id!==id);group()}
async function react(id,e){
  const i=reacts.findIndex(r=>r.message_id===id&&r.user_id===uid&&r.emoji===e);
  if(i>=0){reacts.splice(i,1);draw(msgs.get(id));await sb.from('reactions').delete().match({message_id:id,user_id:uid,emoji:e})}
  else{reacts.push({message_id:id,user_id:uid,emoji:e});draw(msgs.get(id));await sb.from('reactions').insert({message_id:id,emoji:e})}}
function draw(m){
  if(!m)return;msgs.set(m.id,m);const mine=m.user_id===uid;
  const w=el('div','m'+(mine?' me':''));w.dataset.id=m.id;w.dataset.u=m.user_id;
  const mb=members.find(x=>x.id===m.user_id),pic=mb&&mb.avatar_url,a=el('div','av',pic?'':BOTS[m.user_id]||PC[hs(m.user_id)%6]);
  a.style.background=pic?'center/cover url("'+pic+'")':col(m.user_id);
  if(mine){a.style.cursor='pointer';a.title='Change picture';a.onclick=()=>$('avf').click()}
  const b=el('div','b');if(!mine)b.append(el('div','n',m.name));
  const q=m.reply_to&&msgs.get(m.reply_to);if(q)b.append(el('div','q',q.name+': '+(q.body||'📎 media').slice(0,60)));
  if(m.media_url){const v=m.media_type==='video',e=el(v?'video':'img');e.src=m.media_url;
    if(v){e.controls=true;e.preload='metadata'}else{e.loading='lazy';e.onclick=()=>{$('vw').src=m.media_url;$('vwb').classList.remove('hide')}}b.append(e)}
  if(m.body){const f=/^fen:\s*(.+)/i.exec(m.body),bd=f&&board(f[1]);b.append(bd||el('div','',m.body))}
  const rs=reacts.filter(r=>r.message_id===m.id);
  if(rs.length){const row=el('div','rx');for(const e of [...new Set(rs.map(r=>r.emoji))]){
    const n=rs.filter(r=>r.emoji===e),c=el('span','ch'+(n.some(r=>r.user_id===uid)?' on':''),e+' '+n.length);
    c.onclick=ev=>{ev.stopPropagation();react(m.id,e)};row.append(c)}b.append(row)}
  const tm=el('div','t',new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(m.edited?' · edited':''));
  b.append(tm);
  b.onclick=e=>{if(!/^(IMG|VIDEO)$/.test(e.target.tagName))openSheet(m)};
  const cl=el('div','col');cl.append(b);if(mine){const sn=el('div','sn');sn.dataset.id=m.id;cl.append(sn)}
  w.append(a,cl);const old=nodes.get(m.id);if(old)old.replaceWith(w);else $('list').append(w);nodes.set(m.id,w);group();if(ready)updSeen()}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.05;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function add(m){
  if(msgs.has(m.id)){if(JSON.stringify(msgs.get(m.id))!==JSON.stringify(m))draw(m);return}
  const L=$('list'),near=L.scrollHeight-L.scrollTop-L.clientHeight<150,mine=m.user_id===uid;draw(m);
  if(near||mine||!ready)L.scrollTop=L.scrollHeight;
  markRead();
  if(ready&&!mine&&document.hidden){unread++;document.title='('+unread+') Chess Enthusiasts';beep();
    if(!pushOn)notify(m.name,m.body||'Sent a photo or video')}}
async function sync(){
  const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(150);
  const ids=(data||[]).map(m=>m.id),r=ids.length?(await sb.from('reactions').select('*').in('message_id',ids)).data||[]:[];
  const key=x=>x.map(a=>a.message_id+a.user_id+a.emoji).sort().join();
  if(key(r)!==key(reacts)){reacts=r;msgs.forEach(draw)}
  (data||[]).reverse().forEach(add)}
async function startChat(){
  if(started)return;started=true;show('chat');await sync();ready=true;
  const {data:pn}=await sb.from('pin').select('*').maybeSingle();showPin(pn);
  const {data:rd}=await sb.from('reads').select('*');(rd||[]).forEach(r=>reads.set(r.user_id,r.last_id));updSeen();markRead();
  ch=sb.channel('room',{config:{presence:{key:uid},broadcast:{self:false}}});
  const pc=(event,table,fn)=>ch.on('postgres_changes',{event,schema:'public',table},fn);
  pc('INSERT','messages',p=>add(p.new));pc('UPDATE','messages',p=>draw(p.new));pc('DELETE','messages',p=>rm(p.old.id));
  pc('*','members',()=>refreshMembers());pc('*','pin',p=>showPin(p.new));pc('*','reads',p=>{if(p.new){reads.set(p.new.user_id,p.new.last_id);updSeen()}});
  pc('INSERT','reactions',p=>{const r=p.new;if(!reacts.some(x=>x.message_id===r.message_id&&x.user_id===r.user_id&&x.emoji===r.emoji)){reacts.push(r);draw(msgs.get(r.message_id))}});
  pc('DELETE','reactions',p=>{const r=p.old;reacts=reacts.filter(x=>!(x.message_id===r.message_id&&x.user_id===r.user_id&&x.emoji===r.emoji));draw(msgs.get(r.message_id))});
  ch.on('presence',{event:'sync'},()=>{online=Object.keys(ch.presenceState()).length;head()})
    .on('broadcast',{event:'typing'},({payload})=>{$('ty').textContent=payload.name+' is typing…';clearTimeout(tt);tt=setTimeout(()=>$('ty').textContent='',3000)})
    .subscribe(s=>{if(s==='SUBSCRIBED')ch.track({name:me.name})});
  setInterval(sync,15000);initPush();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='Chess Enthusiasts';sync();markRead()}})}
async function send(extra={}){
  const body=$('tx').value.trim();
  if(editing){if(!body)return;const id=editing;editing=null;bar();$('tx').value='';
    const {data,error}=await sb.from('messages').update({body,edited:true}).eq('id',id).select().single();
    if(error){alert('Edit failed: '+error.message);return}draw(data);return}
  if(!body&&!extra.media_url)return;$('tx').value='';
  const row={name:me.name,body:body||null,...extra};if(reply){row.reply_to=reply.id;reply=null;bar()}
  const {data,error}=await sb.from('messages').insert(row).select().single();
  if(error){alert('Send failed: '+error.message);$('tx').value=body;return}add(data);sb.functions.invoke('push',{body:{message_id:data.id}})}
$('f').onsubmit=e=>{e.preventDefault();askPerm();send()};
$('tx').oninput=()=>{const n=Date.now();if(ch&&n-lt>2000){lt=n;ch.send({type:'broadcast',event:'typing',payload:{name:me.name}})}};
$('vwb').onclick=()=>$('vwb').classList.add('hide');
function setBell(){const b=$('bell');if(!window.Notification){b.classList.add('hide');return}b.textContent=Notification.permission==='granted'?'🔔':'🔕'}
function askPerm(){if(window.Notification&&Notification.permission==='default')Notification.requestPermission().then(()=>{setBell();initPush()})}
async function notify(title,body){if(!window.Notification||Notification.permission!=='granted')return;
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'chess-chat',renotify:true});
    else new Notification(title,{body,icon:'icon-192.png'})}catch(e){}}
$('bell').onclick=async()=>{if(!window.Notification)return;
  if(Notification.permission==='denied'){alert('Notifications are blocked. Turn them on for this site or app in your phone/browser settings.');return}
  const p=await Notification.requestPermission();setBell();if(p!=='granted')return;
  if(await enablePush()){const t=await sb.functions.invoke('push',{body:{action:'test'}});if(t.error)alert('Push test failed: '+(t.error.message||t.error))}
  else{notify('Chess Enthusiasts','Notifications are on (while the app is open).');alert('Background alerts could not be set up: '+pushErr)}};
setBell();
/* background push notifications */
let pushOn=false,pushErr='';
const b64=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(r),c=>c.charCodeAt(0))};
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){pushErr='This browser does not support background notifications.';return false}
  try{const reg=await navigator.serviceWorker.ready,k=await sb.functions.invoke('push',{body:{action:'key'}});
    if(k.error||!k.data||!k.data.key)throw (k.error||new Error((k.data&&k.data.error)||'no key'));
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.data.key)});
    const r=await sb.functions.invoke('push',{body:{action:'subscribe',subscription:sub.toJSON()}});if(r.error)throw r.error;
    pushOn=true;return true}
  catch(e){pushErr=String((e&&e.message)||e);return false}}
async function initPush(){if(window.Notification&&Notification.permission==='granted')await enablePush()}
/* GIFs (Giphy) */
const gc=new Map();let gt;
async function gifs(q){const g=$('gg');
  if(typeof GIPHY_KEY==='undefined'||/^PASTE/.test(GIPHY_KEY)){g.textContent='To search GIFs, add a free Giphy key in config.js.';return}
  g.textContent='Loading…';
  try{let d=gc.get(q);
    if(!d){const r=await fetch('https://api.giphy.com/v1/gifs/'+(q?'search':'trending')+'?api_key='+GIPHY_KEY+'&limit=24&rating=pg-13'+(q?'&q='+encodeURIComponent(q):''));
      const j=await r.json();if(!r.ok||!j.data){g.textContent='GIF search failed ('+r.status+'). Check the Giphy key or try later.';return}d=j.data;gc.set(q,d)}
    g.textContent='';if(!d.length)g.textContent='No GIFs found.';
    for(const x of d){const i=el('img');i.src=x.images.fixed_height_small.url;i.alt=x.title||'GIF';i.loading='lazy';
      i.onclick=()=>{$('gp').classList.add('hide');send({media_url:x.images.downsized.url,media_type:'image'})};g.append(i)}}
  catch(e){g.textContent='GIF search failed.'}}
$('gf').onclick=()=>{const p=$('gp');p.classList.toggle('hide');if(!p.classList.contains('hide')){$('gq').value='';gifs('')}};
$('gq').oninput=()=>{clearTimeout(gt);gt=setTimeout(()=>gifs($('gq').value.trim()),700)};
$('at').onclick=()=>$('fi').click();
$('fi').onchange=async()=>{
  const f=$('fi').files[0];$('fi').value='';if(!f)return;
  if(f.size>25*1048576){alert('Files must be under 25 MB.');return}
  $('at').textContent='⏳';
  try{const vid=f.type.startsWith('video'),blob=vid?f:await shrink(f);
    const ext=vid?(f.name.split('.').pop()||'mp4'):(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const path=uid+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('media').upload(path,blob,{contentType:blob.type||f.type});if(error)throw error;
    await send({media_url:sb.storage.from('media').getPublicUrl(path).data.publicUrl,media_type:vid?'video':'image'})}
  catch(e){alert('Upload failed: '+(e.message||e))}
  $('at').textContent='📎'};
async function shrink(f,max){
  if(f.type==='image/gif')return f;
  const bm=await createImageBitmap(f),s=Math.min(1,(max||1280)/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.8))}
/* friendlier UI: grouped avatars, message sheet, menu, jump-to-latest */
function group(){let p=null;for(const n of $('list').children){const u=n.dataset.u;n.classList.toggle('cont',u===p);p=u}}
const closeSheet=()=>$('sh').classList.add('hide');
$('sh').onclick=e=>{if(e.target===$('sh'))closeSheet()};
function sheet(build){const s=$('sh');s.textContent='';const box=el('div','box');
  const A=(t,fn,c)=>{const x=el('button','it'+(c?' '+c:''),t);x.onclick=()=>{closeSheet();fn()};box.append(x)};
  build(box,A);s.append(box);s.classList.remove('hide')}
function openSheet(m){const mine=m.user_id===uid;
  sheet((box,A)=>{const em=el('div','ems');
    EM.forEach(e=>{const x=el('button','em',e);x.onclick=()=>{closeSheet();react(m.id,e)};em.append(x)});box.append(em);
    A('↩  Reply',()=>{editing=null;reply=m;bar();$('tx').focus()});
    if(m.body){A('📋  Copy text',()=>{if(navigator.clipboard)navigator.clipboard.writeText(m.body)});A('📌  Pin to top',()=>setPin(m.body))}
    if(mine&&m.body)A('✏️  Edit',()=>{reply=null;editing=m.id;$('tx').value=m.body;bar();$('tx').focus()});
    if(mine)A('🗑  Delete',async()=>{if(!confirm('Delete this message?'))return;const {error}=await sb.from('messages').delete().eq('id',m.id);if(!error)rm(m.id)},'dg')})}
$('mn').onclick=()=>sheet((box,A)=>{
  A('🖼  Change my profile picture',()=>$('avf').click());
  A('🏆  Chess ratings',()=>$('rtb').onclick());
  if(window.Notification)A(Notification.permission==='granted'?'🔔  Notifications are on':'🔕  Turn on notifications',()=>$('bell').onclick());
  A('✕  Close',()=>{})});
$('list').onscroll=()=>{const L=$('list');$('dn').classList.toggle('hide',L.scrollHeight-L.scrollTop-L.clientHeight<200)};
$('dn').onclick=()=>{const L=$('list');L.scrollTo({top:L.scrollHeight,behavior:'smooth'})};
/* seen receipts (Instagram style: names appear under the last message of yours each person has read) */
const reads=new Map();let sentRead=0;
function updSeen(){
  const mine=[...msgs.values()].filter(x=>x.user_id===uid).sort((a,b)=>a.id-b.id),others=members.filter(x=>x.id!==uid),at=new Map();
  for(const o of others){const lr=reads.get(o.id)||0;let t=null;for(const m of mine)if(m.id<=lr)t=m;
    if(t){if(!at.has(t.id))at.set(t.id,[]);at.get(t.id).push(o.name)}}
  const last=mine.length?mine[mine.length-1].id:0,maxId=Math.max(0,...msgs.keys());
  document.querySelectorAll('.sn').forEach(sn=>{const id=+sn.dataset.id,n=at.get(id);
    sn.textContent=n?(n.length>1&&n.length===others.length?'Seen by everyone':'Seen by '+n.join(', ')):(id===last&&last===maxId?'Sent':'')})}
function markRead(){if(!ready||document.hidden)return;const id=Math.max(0,...msgs.keys());
  if(id>sentRead){sentRead=id;sb.from('reads').upsert({user_id:uid,last_id:id}).then(r=>{if(r.error){sentRead=0;$('ty').textContent='Seen status error: '+r.error.message}})}}
/* pinned message */
const showPin=p=>{const t=p&&p.body;$('pn').classList.toggle('hide',!t);if(t)$('pt').textContent='📌 '+t+(p.by?' — '+p.by:'')};
async function setPin(body){const {error}=await sb.from('pin').upsert({id:1,body,by:me.name,updated_at:new Date().toISOString()});
  if(error)alert('Could not pin: '+error.message);else showPin({body,by:me.name})}
$('px').onclick=()=>setPin('');
/* profile picture */
$('avf').onchange=async()=>{const f=$('avf').files[0];$('avf').value='';if(!f)return;
  try{const b=await shrink(f,160),p=uid+'/avatar-'+Date.now()+'.'+(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type});if(error)throw error;
    const {error:e2}=await sb.from('members').update({avatar_url:sb.storage.from('media').getPublicUrl(p).data.publicUrl}).eq('id',uid);if(e2)throw e2;
    await refreshMembers()}catch(e){alert('Could not set picture: '+(e.message||e))}};
/* ratings from Lichess / Chess.com */
const fmt=(r,b)=>'Rapid '+(r||'-')+' · Blitz '+(b||'-');
async function lr(u){try{const r=await fetch('https://lichess.org/api/user/'+encodeURIComponent(u));if(!r.ok)return'not found';const p=(await r.json()).perfs||{};return fmt(p.rapid&&p.rapid.rating,p.blitz&&p.blitz.rating)}catch(e){return'unavailable'}}
async function cr(u){try{const r=await fetch('https://api.chess.com/pub/player/'+encodeURIComponent(u.toLowerCase())+'/stats');if(!r.ok)return'not found';const s=await r.json(),g=k=>s[k]&&s[k].last&&s[k].last.rating;return fmt(g('chess_rapid'),g('chess_blitz'))}catch(e){return'unavailable'}}
function openRatings(){$('rp').classList.remove('hide');$('rl').textContent='';$('lu').value=me.lichess||'';$('cu').value=me.chesscom||'';
  for(const m of members){const row=el('div','rr'),d=el('div','','Loading…');row.append(el('b','',m.name),d);$('rl').append(row);
    (async()=>{const out=[];if(m.lichess)out.push('Lichess ('+m.lichess+'): '+await lr(m.lichess));
      if(m.chesscom)out.push('Chess.com ('+m.chesscom+'): '+await cr(m.chesscom));d.textContent=out.join('  |  ')||'No username added'})()}}
$('rtb').onclick=openRatings;$('rcl').onclick=()=>$('rp').classList.add('hide');
$('rs').onclick=async()=>{const {error}=await sb.from('members').update({lichess:$('lu').value.trim()||null,chesscom:$('cu').value.trim()||null}).eq('id',uid);
  if(error){alert('Could not save: '+error.message);return}await refreshMembers();openRatings()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
