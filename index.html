<script>
/* Supabase and GIF settings live in config.js */
const $=id=>document.getElementById(id);
addEventListener('error',e=>{const l=$('load');if(l&&!l.classList.contains('hide'))l.textContent='Error: '+e.message});
let sb;try{sb=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_KEY.trim())}catch(e){$('load').textContent='Setup problem: check the values in config.js ('+e.message+')'}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const BOTS={'00000000-0000-0000-0000-000000000001':'🤖','00000000-0000-0000-0000-000000000002':'🦉'};
let uid,me,members=[],started=false,ready=false,ch,reply=null,editing=null,unread=0,online=0,lt=0,tt;
const msgs=new Map(),nodes=new Map();let reacts=[];
const PC=['♔','♕','♖','♗','♘','♙'],EM=['👍','♟️','😂','❤️','😮','🔥'];
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

const head=()=>{$('who').textContent=members.length+' members, '+online+' online: '+members.map(m=>m.name).join(', ')};
async function refreshMembers(){
  const {data,error}=await sb.from('members').select('*').order('created_at');if(error)throw error;
  const k=x=>x.map(m=>m.id+m.avatar_url).join(),o=k(members);members=data;me=members.find(m=>m.id===uid);head();
  if(started&&o!==k(members))msgs.forEach(draw);
  if(started)updSeen()}
async function boot(){if(!sb)return;
  try{let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    uid=session.user.id;await refreshMembers();me?startChat():show('join')}
  catch(e){$('load').textContent='Error: '+(e.message||e)}}
$('go').onclick=async()=>{
  const name=$('nm').value.trim(),pw=$('pw').value,m=$('msg');m.textContent='';
  if(!name||!pw){m.textContent='Enter a name and the passcode.';return}
  const {data,error}=await sb.rpc('join_chat',{p_pass:pw,p_name:name});
  if(error){m.textContent='Could not join: '+error.message;return}
  if(data==='wrong'){m.textContent='Wrong passcode.';return}
  if(data==='full'){m.textContent='Chat is full.';return}
  if(data!=='ok'){m.textContent='Could not join ('+data+').';return}
  await refreshMembers();startChat()};
/* chess board from FEN */
const PS={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function board(fen){const rows=fen.trim().split(' ')[0].split('/');if(rows.length!==8)return null;
  const g=el('div','bd');let ok=true;
  const sq=(r,c,ch)=>{const d=el('div',(r+c)%2?'dk':'lt',ch&&!PCS_ON()?PS[ch]+'\uFE0E':'');if(ch&&ch===ch.toUpperCase())d.classList.add('w');paint(d,ch);g.append(d)};
  rows.forEach((row,i)=>{let c=0;for(const ch of row){if(/[1-8]/.test(ch)){for(let k=0;k<+ch;k++)sq(i,c++,'')}else if(PS[ch])sq(i,c++,ch);else ok=false}if(c!==8)ok=false});
  return ok?g:null}
function bar(){const on=reply||editing;$('rb').classList.toggle('hide',!on);
  if(on)$('rt').textContent=editing?'Editing message':'Replying to '+reply.name+': '+(reply.body||'media').slice(0,40)}

function rm(id){const n=nodes.get(id);if(n)n.remove();nodes.delete(id);msgs.delete(id);reacts=reacts.filter(r=>r.message_id!==id)}
async function react(id,e){
  const i=reacts.findIndex(r=>r.message_id===id&&r.user_id===uid&&r.emoji===e);
  if(i>=0){reacts.splice(i,1);draw(msgs.get(id));await sb.from('reactions').delete().match({message_id:id,user_id:uid,emoji:e})}
  else{reacts.push({message_id:id,user_id:uid,emoji:e});draw(msgs.get(id));await sb.from('reactions').insert({message_id:id,emoji:e})}}
function draw(m){
  if(!m)return;msgs.set(m.id,m);const mine=m.user_id===uid;
  const w=el('div','m'+(mine?' me':''));w.dataset.id=m.id;
  const mb=members.find(x=>x.id===m.user_id),pic=mb&&mb.avatar_url,a=el('div','av',pic?'':BOTS[m.user_id]||PC[hs(m.user_id)%6]);
  a.style.background=pic?'center/cover url("'+pic+'")':col(m.user_id);
  if(mine){a.style.cursor='pointer';a.title='Change picture';a.onclick=()=>$('avf').click()}
  const b=el('div','b');if(!mine)b.append(el('div','n',m.name));
  const q=m.reply_to&&msgs.get(m.reply_to);if(q){const qe=el('div','q',q.name+': '+(q.body||'📎 media').slice(0,60));qe.dataset.to=m.reply_to;b.append(qe)}
  if(m.media_url){const v=m.media_type==='video',e=el(v?'video':'img');e.src=m.media_url;
    if(v){e.controls=true;e.preload='metadata'}else e.loading='lazy';b.append(e)}

const startEdit=m=>{reply=null;editing=m.id;$('tx').value=m.body;bar();$('tx').focus()};
function closePop(){if(popm){popm.remove();popm=null}}
function jump(id){const n=nodes.get(id);if(!n)return;n.scrollIntoView({block:'center',behavior:'smooth'});n.classList.remove('fl');void n.offsetWidth;n.classList.add('fl')}
function openPop(m,row,full){lastPop=Date.now();closePop();const p=el('div','pop'),mine=m.user_id===uid,em=el('div','pe');
  EM.forEach(e=>{const x=el('span','',e);x.onclick=()=>{closePop();react(m.id,e)};em.append(x)});p.append(em);
  if(full){const A=(t,fn,c)=>{const x=el('div','pi'+(c?' '+c:''),t);x.onclick=()=>{closePop();fn()};p.append(x)};
    A('↩  Reply',()=>startReply(m));
    if(m.body&&!SYS(m.body)){A('📋  Copy text',()=>{if(navigator.clipboard)navigator.clipboard.writeText(m.body)});A('📌  Pin to top',()=>setPin(m.body))}
    if(mine&&m.body&&!SYS(m.body))A('✏️  Edit',()=>startEdit(m));
    if(mine)A('🗑  Delete',async()=>{if(!confirm('Delete this message?'))return;const {error}=await sb.from('messages').delete().eq('id',m.id);if(!error)rm(m.id)},'dg')}
  document.body.append(p);const r=row.getBoundingClientRect(),h=p.offsetHeight,w=p.offsetWidth;
  let top=r.top-h-6;if(top<8)top=Math.min(r.bottom+6,innerHeight-h-8);
  p.style.top=top+'px';p.style.left=Math.max(8,Math.min(innerWidth-w-8,(r.left+r.right)/2-w/2))+'px';popm=p}
LS.addEventListener('pointerdown',e=>{
  const row=e.target.closest('.m');if(!row||e.button>0||e.target.closest('video,.ch,.av,button'))return;
  const m=msgs.get(+row.dataset.id);if(!m)return;g={row,m,x:e.clientX,y:e.clientY,drag:false,done:false};
  if(e.pointerType==='touch')g.lp=setTimeout(()=>{if(g&&!g.drag){g.done=true;buzz();openPop(m,row,true)}},500)});
LS.addEventListener('pointermove',e=>{
  if(!g||g.done)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.drag){
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){clearTimeout(g.lp);g=null;return}
    if(!(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.5))return;
    g.drag=true;clearTimeout(g.lp);document.body.classList.add('dg');try{LS.setPointerCapture(e.pointerId)}catch(_){}
    g.ic=el('span','ri','↩');g.row.append(g.ic)}
  const d=Math.max(-90,Math.min(90,dx));g.row.style.transition='none';g.row.style.transform='translateX('+d+'px)';
  g.ic.style.cssText=(d>0?'left:-36px;':'right:-36px;')+'opacity:'+Math.min(1,Math.abs(d)/60);
  if(!g.pass&&Math.abs(d)>=60){g.pass=true;buzz()}});
const endG=e=>{if(!g)return;const s=g;g=null;clearTimeout(s.lp);document.body.classList.remove('dg');
  if(s.drag){const d=e.type==='pointerup'?e.clientX-s.x:0,r=s.row;r.style.transition='transform .2s';r.style.transform='';
    setTimeout(()=>{r.style.transition=''},250);if(s.ic)s.ic.remove();if(Math.abs(d)>=60){buzz();startReply(s.m)}return}
  if(s.done||e.type!=='pointerup')return;
  const t=e.target,qq=t.closest&&t.closest('.q');if(qq){jump(+qq.dataset.to);return}
  const now=Date.now();
  if(gln===s.row&&now-glt<320){clearTimeout(glo);glt=0;gln=null;buzz();openPop(s.m,s.row,false);return}
  glt=now;gln=s.row;
  if(t.tagName==='IMG'&&!t.closest('.bd')){const src=t.src;glo=setTimeout(()=>{$('vw').src=src;$('vwb').classList.remove('hide')},320)}};
LS.addEventListener('pointerup',endG);LS.addEventListener('pointercancel',endG);
LS.addEventListener('contextmenu',e=>{const row=e.target.closest('.m');if(!row)return;e.preventDefault();
  if(Date.now()-lastPop<700)return;const m=msgs.get(+row.dataset.id);if(m)openPop(m,row,true)});
LS.addEventListener('scroll',closePop);
document.addEventListener('pointerdown',e=>{if(popm&&!popm.contains(e.target)&&Date.now()-lastPop>250)closePop()},true);
addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
$('tx').addEventListener('keydown',e=>{
  if(e.key==='Escape'){reply=null;if(editing){editing=null;$('tx').value=''}bar()}
  if(e.key==='ArrowUp'&&!$('tx').value){const mm=[...msgs.values()].filter(x=>x.user_id===uid&&x.body&&!SYS(x.body)).sort((a,b)=>b.id-a.id)[0];if(mm){e.preventDefault();startEdit(mm)}}});
/* seen receipts (Instagram style: names appear under the last message of yours each person has read) */
const reads=new Map();let sentRead=0;
function updSeen(){
  const mine=[...msgs.values()].filter(x=>x.user_id===uid).sort((a,b)=>a.id-b.id),others=members.filter(x=>x.id!==uid),at=new Map();
  for(const o of others){const lr=reads.get(o.id)||0;let t=null;for(const m of mine)if(m.id<=lr)t=m;
    if(t){if(!at.has(t.id))at.set(t.id,[]);at.get(t.id).push(o.name)}}
  const last=mine.length?mine[mine.length-1].id:0,maxId=Math.max(0,...msgs.keys());
  document.querySelectorAll('.sn').forEach(sn=>{const id=+sn.dataset.id,n=at.get(id);
    sn.textContent=n?(n.length>1&&n.length===others.length?'Seen by everyone':'Seen by '+n.join(', ')):(id===last&&last===maxId?'Sent':'')})}
function markRead(){if(!ready||document.hidden)return;const id=Math.max(0,...msgs.keys());
  if(id>sentRead){sentRead=id;sb.from('reads').upsert({user_id:uid,last_id:id}).then(r=>{if(r.error){sentRead=0;$('ty').textContent='Seen status error: '+r.error.message}})}}
/* pinned message */
const showPin=p=>{const t=p&&p.body;$('pn').classList.toggle('hide',!t);if(t)$('pt').textContent='📌 '+t+(p.by?' — '+p.by:'')};
async function setPin(body){const {error}=await sb.from('pin').upsert({id:1,body,by:me.name,updated_at:new Date().toISOString()});
  if(error)alert('Could not pin: '+error.message);else showPin({body,by:me.name})}
$('px').onclick=()=>setPin('');
/* profile picture */
$('avf').onchange=async()=>{const f=$('avf').files[0];$('avf').value='';if(!f)return;
  try{const b=await shrink(f,160),p=uid+'/avatar-'+Date.now()+'.'+(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type});if(error)throw error;
    const {error:e2}=await sb.from('members').update({avatar_url:sb.storage.from('media').getPublicUrl(p).data.publicUrl}).eq('id',uid);if(e2)throw e2;
    await refreshMembers()}catch(e){alert('Could not set picture: '+(e.message||e))}};
/* ratings from Lichess / Chess.com */
const fmt=(r,b)=>'Rapid '+(r||'-')+' · Blitz '+(b||'-');
async function lr(u){try{const r=await fetch('https://lichess.org/api/user/'+encodeURIComponent(u));if(!r.ok)return'not found';const p=(await r.json()).perfs||{};return fmt(p.rapid&&p.rapid.rating,p.blitz&&p.blitz.rating)}catch(e){return'unavailable'}}
async function cr(u){try{const r=await fetch('https://api.chess.com/pub/player/'+encodeURIComponent(u.toLowerCase())+'/stats');if(!r.ok)return'not found';const s=await r.json(),g=k=>s[k]&&s[k].last&&s[k].last.rating;return fmt(g('chess_rapid'),g('chess_blitz'))}catch(e){return'unavailable'}}
function openRatings(){$('rp').classList.remove('hide');$('rl').textContent='';$('lu').value=me.lichess||'';$('cu').value=me.chesscom||'';
  for(const m of members){const row=el('div','rr'),d=el('div','','Loading…');row.append(el('b','',m.name),d);$('rl').append(row);
    (async()=>{const out=[];if(m.lichess)out.push('Lichess ('+m.lichess+'): '+await lr(m.lichess));
      if(m.chesscom)out.push('Chess.com ('+m.chesscom+'): '+await cr(m.chesscom));d.textContent=out.join('  |  ')||'No username added'})()}}
$('rtb').onclick=openRatings;$('rcl').onclick=()=>$('rp').classList.add('hide');
$('rs').onclick=async()=>{const {error}=await sb.from('members').update({lichess:$('lu').value.trim()||null,chesscom:$('cu').value.trim()||null}).eq('id',uid);
  if(error){alert('Could not save: '+error.message);return}await refreshMembers();openRatings()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
