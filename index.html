    if(t){if(!at.has(t.id))at.set(t.id,[]);at.get(t.id).push(o.name)}}
  const last=mine.length?mine[mine.length-1].id:0,maxId=Math.max(0,...msgs.keys());
  document.querySelectorAll('.sn').forEach(sn=>{const id=+sn.dataset.id,n=at.get(id);
    sn.textContent=n?(n.length>1&&n.length===others.length?'Seen by everyone':'Seen by '+n.join(', ')):(id===last&&last===maxId?'Sent':'')})}
function markRead(){if(!ready||document.hidden)return;const id=Math.max(0,...msgs.keys());
  if(id>sentRead){sentRead=id;sb.from('reads').upsert({user_id:uid,last_id:id}).then(r=>{if(r.error){sentRead=0;$('ty').textContent='Seen status error: '+r.error.message}})}}
/* pinned message */
const showPin=p=>{const t=p&&p.body;$('pn').classList.toggle('hide',!t);if(t)$('pt').textContent='📌 '+t+(p.by?' — '+p.by:'')};
async function setPin(body){const {error}=await sb.from('pin').upsert({id:1,body,by:me.name,updated_at:new Date().toISOString()});
  if(error)alert('Could not pin: '+error.message);else showPin({body,by:me.name})}
$('px').onclick=()=>setPin('');
/* profile picture */
$('avf').onchange=async()=>{const f=$('avf').files[0];$('avf').value='';if(!f)return;
  try{const b=await shrink(f,160),p=uid+'/avatar-'+Date.now()+'.'+(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type});if(error)throw error;
    const {error:e2}=await sb.from('members').update({avatar_url:sb.storage.from('media').getPublicUrl(p).data.publicUrl}).eq('id',uid);if(e2)throw e2;
    await refreshMembers()}catch(e){alert('Could not set picture: '+(e.message||e))}};
/* ratings from Lichess / Chess.com */
const fmt=(r,b)=>'Rapid '+(r||'-')+' · Blitz '+(b||'-');
async function lr(u){try{const r=await fetch('https://lichess.org/api/user/'+encodeURIComponent(u));if(!r.ok)return'not found';const p=(await r.json()).perfs||{};return fmt(p.rapid&&p.rapid.rating,p.blitz&&p.blitz.rating)}catch(e){return'unavailable'}}
async function cr(u){try{const r=await fetch('https://api.chess.com/pub/player/'+encodeURIComponent(u.toLowerCase())+'/stats');if(!r.ok)return'not found';const s=await r.json(),g=k=>s[k]&&s[k].last&&s[k].last.rating;return fmt(g('chess_rapid'),g('chess_blitz'))}catch(e){return'unavailable'}}
function openRatings(){$('rp').classList.remove('hide');$('rl').textContent='';$('lu').value=me.lichess||'';$('cu').value=me.chesscom||'';
  for(const m of members){const row=el('div','rr'),d=el('div','','Loading…');row.append(el('b','',m.name),d);$('rl').append(row);
    (async()=>{const out=[];if(m.lichess)out.push('Lichess ('+m.lichess+'): '+await lr(m.lichess));
      if(m.chesscom)out.push('Chess.com ('+m.chesscom+'): '+await cr(m.chesscom));d.textContent=out.join('  |  ')||'No username added'})()}}
$('rtb').onclick=openRatings;$('rcl').onclick=()=>$('rp').classList.add('hide');
$('rs').onclick=async()=>{const {error}=await sb.from('members').update({lichess:$('lu').value.trim()||null,chesscom:$('cu').value.trim()||null}).eq('id',uid);
  if(error){alert('Could not save: '+error.message);return}await refreshMembers();openRatings()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
